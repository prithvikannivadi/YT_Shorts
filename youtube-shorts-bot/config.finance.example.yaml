# ============================================================
# YouTube Shorts Bot - FINANCE channel (example)
# ============================================================
# Copy to config.finance.yaml and run:
#   python -m bot.main run --config config.finance.yaml
# The outdoor channel is identical in shape - just its own fetcher + niche.

channel:
  name: finance
  type: finance
  # DATAVIZ mode: the background is a fully GENERATED animated chart of the
  # numbers in the script (ticking hero figure + growing bars on a dark grid).
  # Zero copyright risk, no source video, no attribution needed - and it fixes
  # the visual/content match that was hurting retention.
  background_mode: dataviz

hook:
  style: overlay        # curiosity-gap text hook on the opening frames
  hold_seconds: 2.6
  max_words: 10         # punchier than Reddit; fewer words = bigger, faster read
  font_size: 112

# Data-viz is fully original, so no attribution is required for finance.
attribution:
  enabled: false

script:
  words_per_second: 2.8
  max_seconds: 58
  min_seconds: 20
  max_parts: 1          # finance shorts are usually single-part
  soften_profanity: true

tts:
  voices:
    - en-US-ChristopherNeural
    - en-US-GuyNeural
  rate: "+10%"

video:
  width: 1080
  height: 1920
  fps: 30
  font: "DejaVu Sans"
  caption_font_size: 104
  caption_words_per_chunk: 2
  highlight_every: 5

upload:
  enabled: true
  privacy: public
  category_id: "25"     # News & Politics (finance/education fits here or 27 Education)
  tags: [finance, money, investing, personal finance, shorts, money tips]
  description_extra: |
    Follow for daily money breakdowns. 💰

    #shorts #finance #money #investing
    Not financial advice.

paths:
  data: data_finance    # separate state per channel so histories don't collide
  assets: assets
  output: output
