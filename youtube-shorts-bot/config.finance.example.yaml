# ============================================================
# YouTube Shorts Bot - FINANCE channel (example)
# ============================================================
# Copy to config.finance.yaml and run:
#   python -m bot.main run --config config.finance.yaml
# The outdoor channel is identical in shape - just its own fetcher + niche.

channel:
  name: finance
  # SOURCE mode: the background is the content's OWN original video, supplied by
  # this channel's fetcher on the segment as `background_source`. Gameplay is
  # NEVER used here - that's exclusive to the Reddit channel.
  background_mode: source

hook:
  style: overlay        # curiosity-gap text hook on the opening frames
  hold_seconds: 2.6
  max_words: 10         # punchier than Reddit; fewer words = bigger, faster read
  font_size: 112

background:
  source_start: 0.0     # where to start inside the source clip (fetcher usually
                        # trims to the relevant moment, so 0.0 is the default)

# Optional: credit the original creator in every description (see CHANNELS.md
# for why this matters for copyright/monetization). The fetcher should set
# segment["source_url"] / segment["source_author"]; leave the template here.
attribution:
  enabled: true
  template: |
    Clip: {source_url}
    Credit: {source_author}

script:
  words_per_second: 2.8
  max_seconds: 58
  min_seconds: 20
  max_parts: 1          # finance shorts are usually single-part
  soften_profanity: true

tts:
  voices:
    - en-US-ChristopherNeural
    - en-US-GuyNeural
  rate: "+10%"

video:
  width: 1080
  height: 1920
  fps: 30
  font: "DejaVu Sans"
  caption_font_size: 104
  caption_words_per_chunk: 2
  highlight_every: 5

upload:
  enabled: true
  privacy: public
  category_id: "25"     # News & Politics (finance/education fits here or 27 Education)
  tags: [finance, money, investing, personal finance, shorts, money tips]
  description_extra: |
    Follow for daily money breakdowns. 💰

    #shorts #finance #money #investing
    Not financial advice.

paths:
  data: data_finance    # separate state per channel so histories don't collide
  assets: assets
  output: output
