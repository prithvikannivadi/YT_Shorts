name: Shorts Bot

on:
  schedule:
    # 3x daily at US engagement hours: 10:00 / 14:00 / 18:30 ET (approx, DST-dependent)
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to YouTube (false = render only, download from artifacts)"
        type: boolean
        default: true

concurrency:
  group: shorts-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: youtube-shorts-bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube-shorts-bot/requirements.txt

      - name: Install dependencies
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core ffmpeg
          pip install -r requirements.txt

      - name: Cache background library
        uses: actions/cache@v4
        with:
          path: youtube-shorts-bot/assets
          key: backgrounds-${{ hashFiles('youtube-shorts-bot/config.yaml') }}
          restore-keys: backgrounds-

      - name: Produce and post one short
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
        run: |
          FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            FLAGS="--no-upload"
          fi
          python -m bot.main run $FLAGS

      - name: Save rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ github.run_id }}
          path: youtube-shorts-bot/output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update shorts-bot state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
