name: Shorts Bot

on:
  schedule:
    # 3x daily (UTC). Comments show approx US Eastern.
    - cron: "0 14 * * *"   # ~9-10am ET
    - cron: "0 18 * * *"   # ~1-2pm ET
    - cron: "30 22 * * *"  # ~5-6pm ET
  workflow_dispatch:
    inputs:
      channels:
        description: "Which channels to run (comma-separated: reddit,finance,outdoor)"
        default: "reddit,finance,outdoor"
      upload:
        description: "Upload to YouTube (false = render only, download from artifacts)"
        type: boolean
        default: true

concurrency:
  group: shorts-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Serialized: matrix jobs each commit state + push, so run them one at a time
    # to avoid push races on the same branch.
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: [reddit, finance, outdoor]
    defaults:
      run:
        working-directory: youtube-shorts-bot
    steps:
      - uses: actions/checkout@v4

      - name: Should this channel run?
        id: gate
        run: |
          WANTED="${{ github.event_name == 'workflow_dispatch' && inputs.channels || 'reddit,finance,outdoor' }}"
          CFG="config.yaml"
          [ "${{ matrix.channel }}" = "finance" ] && CFG="config.finance.yaml"
          [ "${{ matrix.channel }}" = "outdoor" ] && CFG="config.outdoor.yaml"
          RUN=true
          case ",$WANTED," in *",${{ matrix.channel }},"*) ;; *) RUN=false;; esac
          if [ ! -f "$CFG" ]; then
            echo "::notice::$CFG not present - skipping ${{ matrix.channel }} (copy the .example.yaml to enable it)."
            RUN=false
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "config=$CFG" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: youtube-shorts-bot/requirements.txt

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q fonts-dejavu-core ffmpeg
          pip install -r requirements.txt

      - name: Cache background library
        if: steps.gate.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: youtube-shorts-bot/assets
          key: backgrounds-${{ matrix.channel }}
          restore-keys: backgrounds-${{ matrix.channel }}

      - name: Produce and post one short
        if: steps.gate.outputs.run == 'true'
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_REDDIT: ${{ secrets.YT_TOKEN_JSON_REDDIT }}
          YT_FINANCE: ${{ secrets.YT_TOKEN_JSON_FINANCE }}
          YT_OUTDOOR: ${{ secrets.YT_TOKEN_JSON_OUTDOOR }}
        run: |
          # Each channel uploads to its own YouTube account -> its own token.
          case "${{ matrix.channel }}" in
            reddit)  export YT_TOKEN_JSON="$YT_REDDIT";;
            finance) export YT_TOKEN_JSON="$YT_FINANCE";;
            outdoor) export YT_TOKEN_JSON="$YT_OUTDOOR";;
          esac

          # reddit needs the Reddit API; finance/outdoor need the Claude API.
          if [ "${{ matrix.channel }}" = "reddit" ] && { [ -z "$REDDIT_CLIENT_ID" ] || [ -z "$REDDIT_CLIENT_SECRET" ]; }; then
            echo "::warning title=Secrets missing::Reddit secrets not set - skipping reddit."
            exit 0
          fi
          if [ "${{ matrix.channel }}" != "reddit" ] && [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning title=Secrets missing::ANTHROPIC_API_KEY not set - skipping ${{ matrix.channel }}."
            exit 0
          fi

          FLAGS=""
          if [ -z "$YT_TOKEN_JSON" ]; then
            echo "::warning title=No upload token::No YouTube token for ${{ matrix.channel }} - rendering only (see artifacts)."
            FLAGS="--no-upload"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.upload }}" = "false" ]; then
            FLAGS="--no-upload"
          fi
          python -m bot.main run --config "${{ steps.gate.outputs.config }}" $FLAGS

      - name: Save rendered video as artifact
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.channel }}-${{ github.run_id }}
          path: youtube-shorts-bot/output/*.mp4
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit updated state
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "shorts-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data*/state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update ${{ matrix.channel }} state [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
